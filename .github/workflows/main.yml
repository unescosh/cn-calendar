name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 本机已实跑通过的全部检查，CI 负责在干净环境复验
  data-and-core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 数据自洽与生成复现性
        run: |
          python tools/verify_data.py
          node tools/gen_lunar_table.js --check

      - name: 核心测试（零外部依赖，离线）
        working-directory: core
        run: cargo test --offline

      - name: CLI 端到端
        working-directory: core
        run: |
          cargo run --offline --quiet --bin cn_cal_cli -- day 2026-09-30 > /tmp/day.json
          grep -q '烈士纪念日' /tmp/day.json
          cargo run --offline --quiet --bin cn_cal_cli -- verify weekday
          cargo run --offline --quiet --bin cn_cal_cli -- range

      - name: 双实现逐日交叉核对（11299 天 × 7 字段）
        working-directory: core
        run: |
          cargo build --offline --quiet --bin cn_cal_cli
          cd "$GITHUB_WORKSPACE"
          node tools/cross_check_lunar.js "$GITHUB_WORKSPACE/core/target/debug/cn_cal_cli"

      - name: 缓存覆盖闭环与坏数据回退
        working-directory: core
        run: |
          cargo build --offline --quiet --bin cn_cal_cli
          mkdir -p /tmp/cncal-cache
          printf '%s' '{"year":2026,"days":[{"name":"自定义休","date":"2026-11-09","isOffDay":true}]}' > /tmp/cncal-cache/holiday-2026.json
          CN_CAL_HOLIDAY_DIR=/tmp/cncal-cache ./target/debug/cn_cal_cli day 2026-11-09 | grep -q '"rest":true'
          printf '%s' '{"year":2099,"days":[]}' > /tmp/cncal-cache/holiday-2026.json
          CN_CAL_HOLIDAY_DIR=/tmp/cncal-cache ./target/debug/cn_cal_cli day 2026-01-04 | grep -q '"makeup":true'

  # 联网核对：日期/星期基准、上游调休、节日抽样。
  # 断网 -> offline(0)，发现差异 -> 2（需人工确认并更新内置快照）。
  online-verify:
    runs-on: ubuntu-22.04
    needs: data-and-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 构建 CLI
        working-directory: core
        run: cargo build --offline --quiet --bin cn_cal_cli
      - name: 联网核对
        run: |
          python tools/verify_online.py \
            --cli "$GITHUB_WORKSPACE/core/target/debug/cn_cal_cli" \
            --cache "$RUNNER_TEMP/cncal-cache"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-report
          path: ${{ runner.temp }}/cncal-cache/verify-report.json

  flutter-analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      - name: 生成平台壳（仓库不含生成的 runner 文件）
        working-directory: app
        run: flutter create --platforms=linux,windows --project-name cn_calendar --org cn.calendar .
      - name: 依赖
        working-directory: app
        run: flutter pub get
      - name: 静态检查
        # Flutter 3.22 会把 info 级 lint 也当失败；本仓库已有 analysis_options.yaml，
        # 这里再显式关闭 fatal-infos，但 error / warning 仍会让 CI 变红。
        working-directory: app
        run: flutter analyze --no-fatal-infos
      - name: Dart 单元测试
        working-directory: app
        run: flutter test

  # 2026-06 起 GitHub 把 windows-latest / windows-2025 默认镜像切到 VS 2026 (18.x)。
  # Flutter 3.22 的 cmakeGenerator 只认 17 -> "Visual Studio 17 2022"，遇到 18
  # 会落到 default -> "Visual Studio 16 2019"，CMake 随即报
  # "could not find any instance of Visual Studio"。设 CMAKE_GENERATOR 无效，
  # 因为 Flutter 是显式传 -G 的。固定 windows-2022（VS 2022 17.14）是
  # GitHub 官方给出的缓解方案（actions/runner-images#14017），也避免 latest 漂移。
  build-windows:
    needs: [data-and-core, flutter-analyze]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      - name: 确认构建机是 VS 2022（Flutter 3.22 只认 17）
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -format json -products * -utf8 -latest | ConvertFrom-Json
          $major = $vs.installationVersion.Split('.')[0]
          Write-Host "Visual Studio: $($vs.displayName) / $($vs.installationVersion) / major=$major"
          if ($major -ne '17') {
            throw "Flutter 3.22 需要 VS 2022 (17.x)，当前 major=$major。请检查 runs-on 是否为 windows-2022。"
          }
      - name: 生成 Windows runner
        working-directory: app
        run: flutter create --platforms=windows --project-name cn_calendar --org cn.calendar .
      # P2 第 1 步：托盘常驻 + 接管任务栏时间点击。
      # runner 由 flutter create 动态生成，因此用补丁脚本精确插入 4 处字符串
      # 并追加 1 个 .cpp，绝不覆盖 Flutter 3.22 模板文件。脚本内每步都有断言，
      # 模板一旦变化会明确报错，不会静默产出「没打上补丁」的 exe。
      - name: 接入 P2 托盘与任务栏时间接管
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          & ./packaging/p2/windows/apply_p2_patch.ps1
      - name: 构建 CLI
        working-directory: core
        run: cargo build --release --offline --bin cn_cal_cli
      - name: 构建界面
        working-directory: app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: cn-calendar-windows-x64
          path: |
            app/build/windows/x64/runner/Release/
            core/target/release/cn_cal_cli.exe
      # 免安装绿色包：把静态 CLI 与自启开关一起放进 Release 目录再压成 zip，
      # 用户解压后双击 cn_calendar.exe 即可，不需要安装程序。
      - name: 组装免安装绿色包（含开机自启开关）
        shell: pwsh
        run: |
          $release = 'app/build/windows/x64/runner/Release'
          Copy-Item 'core/target/release/cn_cal_cli.exe' "$release/cn_cal_cli.exe" -Force
          Copy-Item 'packaging/windows/enable-autostart.bat' "$release/" -Force
          Copy-Item 'packaging/windows/disable-autostart.bat' "$release/" -Force
          Copy-Item 'packaging/windows/README.txt' "$release/" -Force
          $zip = Join-Path $env:RUNNER_TEMP 'cn-calendar-windows-x64.zip'
          Compress-Archive -Path "$release/*" -DestinationPath $zip -Force
          Write-Host "绿色包：$zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cn-calendar-windows-portable
          path: ${{ runner.temp }}/cn-calendar-windows-x64.zip

  # 说明：ubuntu-22.04 的 glibc 2.35 产物不能在 UOS 20（glibc 2.28）运行。
  # 此 job 只验证 Linux 侧代码可编译；面向 UOS 20 的正式包必须在
  # glibc <= 2.28 的环境（Debian 10 容器 / UOS 实机）构建，见 packaging/uos/README.md。
  build-linux-bundle:
    needs: [data-and-core, flutter-analyze]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      - name: Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libglu1-mesa
      - name: 生成 Linux runner
        working-directory: app
        run: flutter create --platforms=linux --project-name cn_calendar --org cn.calendar .
      - name: 构建 CLI
        working-directory: core
        run: cargo build --release --offline --bin cn_cal_cli
      - name: 构建界面
        working-directory: app
        run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: cn-calendar-linux-bundle
          path: |
            app/build/linux/x64/release/bundle/
            core/target/release/cn_cal_cli

  # UOS 20 实机体检（reports/uos-check-report.json）确认：glibc 2.28、x86_64、
  # X11、libgtk-3/libGL/libX11 齐全、显卡硬件加速正常。唯一障碍是
  # ubuntu-22.04 (glibc 2.35) 的动态产物会报 GLIBC_2.34 not found。
  # 核心零外部依赖，用 musl 静态链接即可在任意 x86_64 Linux 上直接运行，
  # 不需要在 UOS 上安装任何开发工具。
  # 注意：这只解决「计算核心」，Flutter 界面 bundle 仍需在 glibc <= 2.28
  # 环境构建并实机验证，不能以本 job 通过就断定界面可跑。
  build-uos20-cli:
    needs: data-and-core
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl 链接工具
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: 静态编译核心（UOS 20 可直接运行）
        working-directory: core
        run: cargo build --offline --release --bin cn_cal_cli --target x86_64-unknown-linux-musl
      - name: 确认产物不依赖 glibc 且在 Linux 上算得对
        run: |
          BIN=core/target/x86_64-unknown-linux-musl/release/cn_cal_cli
          file "$BIN"
          ldd "$BIN" 2>&1 || true
          "$BIN" day 2026-09-30 | grep -q '烈士纪念日'
          "$BIN" verify weekday | grep -q '"consistent":true'
          "$BIN" range
      - uses: actions/upload-artifact@v4
        with:
          name: cn_cal_cli-uos20-x64-static
          path: core/target/x86_64-unknown-linux-musl/release/cn_cal_cli

  # UOS 20 界面实机试跑（reports/UOS界面试跑结果.txt）确认：
  #   libflutter_linux_gtk.so 最高只要求 GLIBC_2.18、libapp.so 无额外要求，
  #   唯独 23KB 的 runner（cn_calendar）因在 ubuntu-22.04 (glibc 2.35) 编译
  #   而要求 GLIBC_2.34，启动即被动态链接器拒绝。
  # 因此在 Debian 10（glibc 2.28，与 UOS 20 同系）容器内重编整个 bundle。
  # 关键防线：CI 内用 objdump 检查产物最高 glibc 符号，不再等实机才发现。
  build-uos20-bundle:
    needs: [data-and-core, flutter-analyze]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: musl 工具（静态计算核心）
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: 静态编译核心
        run: cargo build --offline --release --manifest-path core/Cargo.toml --bin cn_cal_cli --target x86_64-unknown-linux-musl
      - name: 在 Debian 10（glibc 2.28）容器内编译 Flutter 界面
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src debian:10 bash -euxc '
            printf "%s\n" \
              "deb http://archive.debian.org/debian buster main" \
              "deb http://archive.debian.org/debian-security buster/updates main" \
              > /etc/apt/sources.list
            printf "Acquire::Check-Valid-Until \"false\";\n" > /etc/apt/apt.conf.d/99no-valid
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates curl git unzip xz-utils clang cmake ninja-build \
              pkg-config libgtk-3-dev liblzma-dev libglu1-mesa
            git clone --depth 1 -b 3.22.0 https://github.com/flutter/flutter.git /flutter
            git config --global --add safe.directory /flutter
            git config --global --add safe.directory /src
            export PATH="/flutter/bin:$PATH"
            cd /src/app
            flutter create --platforms=linux --project-name cn_calendar --org cn.calendar .
            flutter pub get
            flutter build linux --release
          '
      - name: 组装 UOS 包并核对 glibc 符号上限
        run: |
          # 容器内以 root 写入 app/build，宿主 runner 用户需先取回所有权，
          # 否则往 bundle 里放静态 cn_cal_cli 会报 Permission denied。
          sudo chown -R "$(id -u):$(id -g)" app/build
          BUNDLE=app/build/linux/x64/release/bundle
          cp core/target/x86_64-unknown-linux-musl/release/cn_cal_cli "$BUNDLE/cn_cal_cli"
          chmod +x "$BUNDLE/cn_cal_cli"
          MAX=$(objdump -T "$BUNDLE/cn_calendar" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "runner 最高 glibc 符号: $MAX"
          case "$MAX" in
            GLIBC_2.29*|GLIBC_2.3[0-9]*|GLIBC_2.[4-9][0-9]*)
              echo "产物 glibc 过高，UOS 20 (2.28) 无法运行"; exit 1;;
          esac
          "$BUNDLE/cn_cal_cli" day 2026-09-30 | grep -q '烈士纪念日'
      - uses: actions/upload-artifact@v4
        with:
          name: cn-calendar-uos20-bundle
          path: app/build/linux/x64/release/bundle/
      # deb 只是打包（dpkg-deb 不编译），包内二进制已在 Debian 10 /
      # glibc 2.28 环境构建并实机验证，因此可在 ubuntu-22.04 上组装。
      - name: 组装 UOS 20 安装包（含开机自启）
        run: |
          BUNDLE=app/build/linux/x64/release/bundle
          DEB="$RUNNER_TEMP/cn-calendar_0.1.0_amd64.deb"
          bash packaging/uos/build_deb.sh "$BUNDLE" "$DEB"
          dpkg-deb -I "$DEB"
          dpkg-deb -c "$DEB" | grep -q 'opt/cn-calendar/cn_calendar'
          dpkg-deb -c "$DEB" | grep -q 'opt/cn-calendar/cn_cal_cli'
          dpkg-deb -c "$DEB" | grep -q 'usr/bin/cn-calendar'
          dpkg-deb -c "$DEB" | grep -q 'etc/xdg/autostart/cn-calendar.desktop'
      - uses: actions/upload-artifact@v4
        with:
          name: cn-calendar-uos20-deb
          path: ${{ runner.temp }}/cn-calendar_0.1.0_amd64.deb
